<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>程序员模拟面试系统</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="sidebar">
        <div class="brand">
          <div class="brand-mark">AI</div>
          <div>
            <h1>程序员模拟面试系统</h1>
            <p>模拟面试官、真实追问压力和复盘报告，一次完整练习。</p>
          </div>
        </div>

        <form id="setupForm" class="setup-form">
          <label>
            <span>面试方向</span>
            <select name="role">
              <option value="java">Java 后端</option>
              <option value="backend">后端开发</option>
              <option value="frontend">前端开发</option>
              <option value="fullstack">全栈开发</option>
              <option value="go">Go 后端</option>
              <option value="python">Python 后端</option>
            </select>
          </label>

          <label>
            <span>面试级别</span>
            <select name="level">
              <option value="junior">初级</option>
              <option value="middle" selected>中级</option>
              <option value="senior">高级</option>
            </select>
          </label>

          <label>
            <span>面试风格</span>
            <select name="style">
              <option value="normal">常规面试</option>
              <option value="pressure">压力面试</option>
              <option value="coaching">教练模式</option>
            </select>
          </label>
          <div id="styleHint" class="style-hint" aria-live="polite"></div>

          <label>
            <span>题目数量</span>
            <input name="questionCount" type="number" min="3" max="6" value="5" />
          </label>

          <label class="wide">
            <span>简历或项目背景</span>
            <textarea
              name="resume"
              rows="6"
              placeholder="示例：负责订单平台，技术栈 Spring Boot、MySQL、Redis、RabbitMQ，主导库存扣减、失败补偿和线上问题排查。"
            ></textarea>
          </label>

          <button type="submit" class="primary-button">开始模拟面试</button>
        </form>

        <div class="provider-note">
          <strong>AI 提供方</strong>
          <span id="providerText">尚未开始</span>
        </div>
      </section>

      <section class="interview-panel">
        <div class="panel-header">
          <div>
            <h2>面试对话</h2>
            <p id="statusText">选择配置后开始。如果没有配置模型，系统会使用本地模拟面试官。</p>
          </div>
          <button id="finishButton" class="ghost-button" disabled>结束并生成报告</button>
        </div>

        <div id="messages" class="messages empty-state">
          <p>面试官会在这里开场，并提出第一道问题。</p>
        </div>

        <aside id="liveCoach" class="live-coach empty-state">
          <p>开始面试后，这里会显示面试官当前正在考察什么。</p>
        </aside>

        <form id="answerForm" class="answer-form">
          <textarea id="answerInput" rows="4" placeholder="在这里输入你的回答..." disabled></textarea>
          <button type="submit" class="primary-button" disabled>提交回答</button>
        </form>
      </section>

      <section class="report-panel">
        <div class="panel-header">
          <div>
            <h2>复盘报告</h2>
            <p>面试结束后查看评分信号、差距分析和更好的回答示例。</p>
          </div>
        </div>
        <div id="report" class="report empty-state">
          <p>完成一轮面试后会生成复盘报告。</p>
        </div>
      </section>
    </main>

    <script src="/app.js?v=zh-cn-4" type="module"></script>
  </body>
</html>
